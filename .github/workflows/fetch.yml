name: Quellen abrufen

on:
  schedule:
    - cron: "47 5 1 * *" # monatlich am 1. um 05:47 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: quellen-abruf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git-Identität
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Quellen abrufen und Änderungen committen
        id: fetch
        run: python fetch.py --commit
      - name: Push
        run: git push
      - name: Issue bei geänderter Quelle
        if: steps.fetch.outputs.changed_g != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Quelle geändert: ${{ steps.fetch.outputs.changed_g }}"
        run: gh issue create --title "$TITLE" --body-file issue.md
